<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FactoryMind 3D</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090b12;
    --panel: #10141c;
    --panel-2: #171c27;
    --edge: #283242;
    --text: #dfe8ee;
    --muted: #7f8c9a;
    --cyan: #52eeff;
    --green: #42dc83;
    --yellow: #f0bd45;
    --red: #e45a5a;
    --magenta: #db5cff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  #app {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 410px;
    background: var(--bg);
  }

  #stage {
    position: relative;
    min-width: 0;
    min-height: 0;
  }

  #stage canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hint {
    position: absolute;
    left: 14px;
    bottom: 14px;
    padding: 8px 10px;
    border: 1px solid rgba(82, 238, 255, 0.18);
    background: rgba(9, 11, 18, 0.72);
    color: var(--muted);
    pointer-events: none;
  }

  #panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    border-left: 1px solid var(--edge);
    background: var(--panel);
  }

  .title {
    color: var(--cyan);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  .underline {
    width: 176px;
    height: 2px;
    margin-top: 5px;
    background: var(--cyan);
    box-shadow: 0 0 16px rgba(82, 238, 255, 0.75);
  }

  .subtitle {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
  }

  .rule {
    height: 1px;
    background: var(--edge);
    flex: 0 0 auto;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }

  .tile {
    min-width: 0;
    min-height: 54px;
    padding: 6px 4px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: var(--panel-2);
    text-align: center;
  }

  .tile .label {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .tile .value {
    margin-top: 4px;
    color: var(--cyan);
    font-size: 17px;
    font-weight: 800;
    white-space: nowrap;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .row3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .builder-tools {
    display: none;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }

  .builder-tools.active {
    display: grid;
  }

  button {
    min-width: 0;
    height: 32px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--muted);
    font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
  }

  button:hover,
  button.active {
    color: var(--cyan);
    border-color: var(--cyan);
  }

  button.start { color: var(--green); border-color: rgba(66, 220, 131, 0.45); background: #0d2117; }
  button.stop { color: var(--yellow); border-color: rgba(240, 189, 69, 0.48); background: #21190d; }
  button.reset { color: var(--red); border-color: rgba(228, 90, 90, 0.55); background: #211111; }

  #endpoints {
    min-height: 44px;
    padding: 8px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: #0c1017;
    color: var(--muted);
    font-size: 10px;
    white-space: pre-wrap;
    overflow: hidden;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--cyan);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  #run-state {
    color: var(--yellow);
    font-size: 10px;
  }

  #log {
    flex: 1 1 auto;
    min-height: 150px;
    max-height: 52vh;
    overflow: hidden;
    padding: 8px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: #0b0f16;
  }

  .log-row {
    display: grid;
    grid-template-columns: 54px 74px minmax(0, 1fr);
    gap: 5px;
    padding: 2px 0;
    font-size: 10px;
    white-space: nowrap;
  }

  .log-row span {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ts { color: var(--muted); }
  .type-ASSIGN { color: var(--cyan); }
  .type-OBSERVE { color: #c9d0d8; }
  .type-RETHINK { color: var(--magenta); }
  .type-COMPLETE { color: var(--green); }
  .type-WARNING { color: var(--yellow); }

  #workers {
    display: grid;
    gap: 4px;
    min-height: 54px;
  }

  .worker-row {
    display: grid;
    grid-template-columns: 78px minmax(0, 1fr);
    gap: 8px;
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
  }

  .worker-row strong {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .worker-row span {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #cloud {
    margin-top: auto;
    height: 38px;
    color: var(--red);
    border-color: rgba(228, 90, 90, 0.55);
    background: #211111;
  }

  #cloud.online {
    color: var(--green);
    border-color: rgba(66, 220, 131, 0.48);
    background: #0d2117;
  }

  @media (max-width: 980px) {
    #app { grid-template-columns: 1fr; }
    #panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(390px, 100vw);
      background: rgba(16, 20, 28, 0.96);
    }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="app">
  <div id="stage">
    <div id="hint">Drag to orbit. Scroll to zoom. Builder mode places objects on the floor.</div>
  </div>

  <aside id="panel">
    <div>
      <div class="title">FACTORYMIND 3D</div>
      <div class="underline"></div>
      <div class="subtitle">Nemotron + DGX Spark GX10</div>
    </div>
    <div class="rule"></div>

    <div class="stats">
      <div class="tile"><div class="label">COMPLETED</div><div class="value" id="stat-completed">0</div></div>
      <div class="tile"><div class="label">TIME</div><div class="value" id="stat-time">00:00</div></div>
      <div class="tile"><div class="label">RATE/MIN</div><div class="value" id="stat-rate">0.0</div></div>
      <div class="tile"><div class="label">LAST ROUTE</div><div class="value" id="stat-last">--</div></div>
    </div>

    <div class="row">
      <button id="mode-cursor" class="active">CURSOR</button>
      <button id="mode-builder">BUILDER</button>
    </div>

    <div id="builder-tools" class="builder-tools">
      <button data-tool="wall" class="active">WALL</button>
      <button data-tool="factory">FACTORY</button>
      <button data-tool="dropbox">DROP BOX</button>
      <button data-tool="worker">WORKER</button>
    </div>

    <button id="speed">SPEED 1x</button>
    <div id="endpoints">connecting...</div>
    <div class="rule"></div>

    <div class="section-head">
      <span>LEADER THOUGHT PROCESS</span>
      <span id="run-state">STOPPED</span>
    </div>
    <div id="log"></div>

    <div class="section-head"><span>WORKER STATUS</span></div>
    <div id="workers"></div>

    <div class="rule"></div>
    <div class="row3">
      <button id="start" class="start">START</button>
      <button id="stop" class="stop">STOP</button>
      <button id="reset" class="reset">RESET</button>
    </div>

    <button id="cloud">DISCONNECT CLOUD</button>
  </aside>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const GRID = 50;
const STATE_URL = "/state.json";
const ACTION_URL = "/action";
const ROTATION_STEP_Y = Math.PI / 4;
const COLORS = {
  accent: 0x52eeff,
  worker: 0xff8c00,
  floor: 0x111722,
  wall: 0x3d465f,
};
const colorFallback = {
  Red: [232, 72, 72],
  Blue: [68, 130, 235],
  Green: [72, 210, 118],
  Yellow: [235, 205, 70],
  Magenta: [214, 78, 235],
  Cyan: [0, 212, 255],
};

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b12);
scene.fog = new THREE.Fog(0x080b12, 55, 150);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 220);
camera.position.set(38, 48, 68);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(GRID / 2, 0, GRID / 2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 18;
controls.maxDistance = 125;

scene.add(new THREE.HemisphereLight(0xdff8ff, 0x15101c, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 1.75);
key.position.set(35, 72, 25);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -40;
key.shadow.camera.right = 80;
key.shadow.camera.top = 80;
key.shadow.camera.bottom = -40;
scene.add(key);
const rim = new THREE.DirectionalLight(0x69a7ff, 0.5);
rim.position.set(-30, 28, -45);
scene.add(rim);

const floorGeo = new THREE.PlaneGeometry(GRID, GRID);
floorGeo.rotateX(-Math.PI / 2);
const floor = new THREE.Mesh(
  floorGeo,
  new THREE.MeshStandardMaterial({ color: COLORS.floor, roughness: 0.85, metalness: 0.12 }),
);
floor.position.set(GRID / 2, 0, GRID / 2);
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(GRID, 100, 0x243041, 0x18202d);
grid.position.set(GRID / 2, 0.012, GRID / 2);
scene.add(grid);

const pickPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(GRID, GRID),
  new THREE.MeshBasicMaterial({ visible: false }),
);
pickPlane.rotation.x = -Math.PI / 2;
pickPlane.position.set(GRID / 2, 0.04, GRID / 2);
scene.add(pickPlane);

const wallMeshes = new Map();
const factoryMeshes = new Map();
const dropboxMeshes = new Map();
const workerMeshes = new Map();
const packageMeshes = new Map();
const workerVisualPos = new Map();
let leaderMesh = null;
let latestWorld = {};
let pathLines = [];
let mode = "cursor";
let builderTool = "wall";
const builderRotationY = { factory: 0, dropbox: 0 };
let painting = false;
let painted = new Set();

function gridToWorld(cell) {
  return { x: cell[0] + 0.5, z: cell[1] + 0.5 };
}

function rgbToHex(rgb) {
  return ((rgb[0] & 255) << 16) + ((rgb[1] & 255) << 8) + (rgb[2] & 255);
}

function colorFor(name, rgb) {
  return rgbToHex(rgb || colorFallback[name] || [180, 190, 200]);
}

function makeLabel(text, color = "#dfe8ee", scale = 1) {
  const canvas = document.createElement("canvas");
  canvas.width = 384;
  canvas.height = 96;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "700 46px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = "rgba(0,0,0,0.9)";
  ctx.shadowBlur = 10;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.1 * scale, 1.0 * scale, 1);
  return sprite;
}

function disposeObject(obj) {
  obj.traverse((child) => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose());
      else child.material.dispose();
    }
  });
}

function syncWalls(world) {
  const seen = new Set();
  for (const cell of world.wall || []) {
    const keyName = cell[0] + "," + cell[1];
    seen.add(keyName);
    if (wallMeshes.has(keyName)) continue;
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1.15, 1),
      new THREE.MeshStandardMaterial({ color: COLORS.wall, roughness: 0.62, metalness: 0.18 }),
    );
    const p = gridToWorld(cell);
    mesh.position.set(p.x, 0.58, p.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    wallMeshes.set(keyName, mesh);
  }
  for (const [keyName, mesh] of wallMeshes) {
    if (seen.has(keyName)) continue;
    scene.remove(mesh);
    disposeObject(mesh);
    wallMeshes.delete(keyName);
  }
}

function syncFactories(world) {
  const seen = new Set();
  for (const factory of world.factories || []) {
    seen.add(factory.id);
    let group = factoryMeshes.get(factory.id);
    const hex = colorFor(factory.color, factory.color_rgb);
    if (!group) {
      group = new THREE.Group();
      group.userData.factory = factory;
      const shell = new THREE.Mesh(
        new THREE.BoxGeometry(3, 1.6, 3),
        new THREE.MeshStandardMaterial({
          color: 0x202936,
          emissive: hex,
          emissiveIntensity: 0.08,
          roughness: 0.55,
          metalness: 0.35,
        }),
      );
      shell.position.set(1.5, 0.8, 1.5);
      shell.castShadow = true;
      shell.receiveShadow = true;
      group.add(shell);

      const cap = new THREE.Mesh(
        new THREE.BoxGeometry(2.1, 0.25, 2.1),
        new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: 0.5 }),
      );
      cap.position.set(1.5, 1.75, 1.5);
      group.add(cap);

      const belt = new THREE.Mesh(
        new THREE.BoxGeometry(factory.belt_length, 0.16, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x252b34, roughness: 0.75, metalness: 0.22 }),
      );
      belt.position.set(3 + factory.belt_length / 2, 0.12, 1.5);
      belt.receiveShadow = true;
      group.add(belt);

      const dashes = [];
      for (let i = 0; i < 8; i += 1) {
        const dash = new THREE.Mesh(
          new THREE.BoxGeometry(0.42, 0.04, 0.72),
          new THREE.MeshBasicMaterial({ color: 0x9098a5 }),
        );
        dash.position.y = 0.24;
        dash.position.z = 1.5;
        group.add(dash);
        dashes.push(dash);
      }
      group.userData.dashes = dashes;

      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(1, 0.08, 1),
        new THREE.MeshStandardMaterial({ color: 0x151b23, emissive: hex, emissiveIntensity: 0.25 }),
      );
      pad.position.set(factory.drop_pad[0] - factory.pos[0] + 0.5, 0.08, factory.drop_pad[1] - factory.pos[1] + 0.5);
      pad.receiveShadow = true;
      group.add(pad);

      const label = makeLabel(factory.name, "#" + hex.toString(16).padStart(6, "0"), 0.72);
      label.position.set(1.5, 2.65, 1.5);
      group.add(label);

      scene.add(group);
      factoryMeshes.set(factory.id, group);
    }
    group.position.set(factory.pos[0], 0, factory.pos[1]);
    group.rotation.y = Number(factory.rotation_y || 0);
    group.userData.factory = factory;
  }
  for (const [id, group] of factoryMeshes) {
    if (seen.has(id)) continue;
    scene.remove(group);
    disposeObject(group);
    factoryMeshes.delete(id);
  }
}

function syncDropboxes(world) {
  const seen = new Set();
  for (const box of world.dropboxes || []) {
    seen.add(box.id);
    let group = dropboxMeshes.get(box.id);
    const hex = colorFor(box.color, box.color_rgb);
    const labelText = `${box.name} ${box.delivered || 0}`;
    if (!group) {
      group = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(3, 0.16, 2),
        new THREE.MeshStandardMaterial({ color: 0x141922, roughness: 0.8 }),
      );
      base.position.set(1.5, 0.08, 1);
      base.receiveShadow = true;
      group.add(base);

      const mat = new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: 0.2, roughness: 0.45 });
      const back = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 0.16), mat);
      back.position.set(1.5, 0.48, 1.92);
      const left = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.8, 2), mat);
      left.position.set(0.08, 0.48, 1);
      const right = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.8, 2), mat);
      right.position.set(2.92, 0.48, 1);
      group.add(back, left, right);

      group.userData.label = makeLabel(labelText, "#" + hex.toString(16).padStart(6, "0"), 0.62);
      group.userData.label.position.set(1.5, 1.65, 1);
      group.add(group.userData.label);
      group.userData.labelText = labelText;

      scene.add(group);
      dropboxMeshes.set(box.id, group);
    }
    if (group.userData.labelText !== labelText) {
      group.remove(group.userData.label);
      disposeObject(group.userData.label);
      group.userData.label = makeLabel(labelText, "#" + hex.toString(16).padStart(6, "0"), 0.62);
      group.userData.label.position.set(1.5, 1.65, 1);
      group.add(group.userData.label);
      group.userData.labelText = labelText;
    }
    group.position.set(box.pos[0], 0, box.pos[1]);
    group.rotation.y = Number(box.rotation_y || 0);
  }
  for (const [id, group] of dropboxMeshes) {
    if (seen.has(id)) continue;
    scene.remove(group);
    disposeObject(group);
    dropboxMeshes.delete(id);
  }
}

function syncLeader(world) {
  const leader = world.leader;
  if (!leader) return;
  if (!leaderMesh) {
    leaderMesh = new THREE.Group();
    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(0.76, 1.05, 3.5, 30),
      new THREE.MeshStandardMaterial({
        color: 0x123c4c,
        emissive: COLORS.accent,
        emissiveIntensity: 0.26,
        roughness: 0.34,
        metalness: 0.45,
      }),
    );
    cyl.position.y = 1.75;
    cyl.castShadow = true;
    cyl.receiveShadow = true;
    leaderMesh.add(cyl);

    const top = new THREE.Mesh(
      new THREE.SphereGeometry(0.58, 24, 16),
      new THREE.MeshStandardMaterial({ color: COLORS.accent, emissive: COLORS.accent, emissiveIntensity: 0.9 }),
    );
    top.position.y = 3.7;
    leaderMesh.add(top);
    leaderMesh.userData.glow = top;

    const mast = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, 1.6, 10),
      new THREE.MeshBasicMaterial({ color: COLORS.accent }),
    );
    mast.position.y = 4.55;
    leaderMesh.add(mast);

    const label = makeLabel("LEADER", "#52eeff", 0.85);
    label.position.set(0, 5.35, 0);
    leaderMesh.add(label);
    scene.add(leaderMesh);
  }
  const p = gridToWorld(leader.pos);
  leaderMesh.position.set(p.x, 0, p.z);
}

function syncWorkers(world) {
  const seen = new Set();
  for (const worker of world.workers || []) {
    seen.add(worker.id);
    let group = workerMeshes.get(worker.id);
    if (!group) {
      group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.46, 28, 18),
        new THREE.MeshStandardMaterial({
          color: COLORS.worker,
          emissive: COLORS.worker,
          emissiveIntensity: 0.35,
          roughness: 0.3,
          metalness: 0.36,
        }),
      );
      body.position.y = 0.46;
      body.castShadow = true;
      group.add(body);
      group.userData.body = body;

      const ringGeo = new THREE.RingGeometry(0.62, 0.78, 32);
      ringGeo.rotateX(-Math.PI / 2);
      const ring = new THREE.Mesh(
        ringGeo,
        new THREE.MeshBasicMaterial({ color: COLORS.worker, transparent: true, opacity: 0.28, side: THREE.DoubleSide }),
      );
      ring.position.y = 0.04;
      group.add(ring);
      group.userData.ring = ring;

      const carried = new THREE.Mesh(
        new THREE.BoxGeometry(0.38, 0.38, 0.38),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45 }),
      );
      carried.position.set(0.23, 1.02, 0);
      carried.visible = false;
      group.add(carried);
      group.userData.carried = carried;

      const label = makeLabel(String(worker.id), "#111111", 0.42);
      label.position.set(0, 1.32, 0);
      group.add(label);
      scene.add(group);
      workerMeshes.set(worker.id, group);
    }

    const target = gridToWorld(worker.pos);
    let visual = workerVisualPos.get(worker.id);
    if (!visual) {
      visual = { x: target.x, z: target.z, target };
      workerVisualPos.set(worker.id, visual);
      group.position.set(target.x, 0, target.z);
    } else {
      visual.target = target;
    }

    const carrying = worker.carrying;
    group.userData.carried.visible = Boolean(carrying);
    if (carrying) {
      group.userData.carried.material.color.setHex(colorFor(carrying.color, carrying.color_rgb));
    }
  }
  for (const [id, group] of workerMeshes) {
    if (seen.has(id)) continue;
    scene.remove(group);
    disposeObject(group);
    workerMeshes.delete(id);
    workerVisualPos.delete(id);
  }
}

function packagePosition(world, pkg, padIndexById) {
  if (pkg.status === "conveyor") {
    const factory = (world.factories || []).find((item) => item.id === pkg.factory_id);
    if (!factory) return null;
    return {
      x: factory.belt_start[0] + Math.min(pkg.progress || 0, factory.belt_length || 5) + 0.5,
      y: 0.52,
      z: factory.belt_start[1] + 0.5,
    };
  }
  if (pkg.status === "pad") {
    const factory = (world.factories || []).find((item) => item.id === pkg.factory_id);
    if (!factory) return null;
    const idx = padIndexById.get(pkg.id) || 0;
    return {
      x: factory.drop_pad[0] + 0.36 + (idx % 2) * 0.28,
      y: 0.38 + idx * 0.16,
      z: factory.drop_pad[1] + 0.36 + Math.floor(idx / 2) * 0.18,
    };
  }
  return null;
}

function syncPackages(world) {
  const padIndexById = new Map();
  for (const factory of world.factories || []) {
    (factory.pad_packages || []).forEach((pkg, idx) => padIndexById.set(pkg.id, Math.min(idx, 5)));
  }

  const seen = new Set();
  for (const pkg of world.packages || []) {
    const pos = packagePosition(world, pkg, padIndexById);
    if (!pos) continue;
    seen.add(pkg.id);
    let mesh = packageMeshes.get(pkg.id);
    const hex = colorFor(pkg.color, pkg.color_rgb);
    if (!mesh) {
      mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.46, 0.46, 0.46),
        new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: 0.18, roughness: 0.42 }),
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      packageMeshes.set(pkg.id, mesh);
    }
    mesh.material.color.setHex(hex);
    mesh.material.emissive.setHex(hex);
    mesh.position.set(pos.x, pos.y, pos.z);
  }
  for (const [id, mesh] of packageMeshes) {
    if (seen.has(id)) continue;
    scene.remove(mesh);
    disposeObject(mesh);
    packageMeshes.delete(id);
  }
}

function syncPaths(world) {
  for (const line of pathLines) {
    scene.remove(line);
    line.geometry.dispose();
    line.material.dispose();
  }
  pathLines = [];
  for (const worker of world.workers || []) {
    if (!worker.path || !worker.path.length) continue;
    const points = [gridToWorld(worker.pos), ...worker.path.map(gridToWorld)]
      .map((p) => new THREE.Vector3(p.x, 0.09, p.z));
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color: COLORS.worker, transparent: true, opacity: 0.36 }),
    );
    scene.add(line);
    pathLines.push(line);
  }
}

function syncScene(world) {
  latestWorld = world;
  syncWalls(world);
  syncFactories(world);
  syncDropboxes(world);
  syncLeader(world);
  syncWorkers(world);
  syncPackages(world);
  syncPaths(world);
}

function fmtTime(value) {
  const seconds = Math.max(0, Math.floor(value || 0));
  return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
}

function updatePanel(world, info) {
  const stats = world.stats || {};
  document.getElementById("stat-completed").textContent = stats.completed || 0;
  document.getElementById("stat-time").textContent = fmtTime(stats.elapsed || 0);
  document.getElementById("stat-rate").textContent = Number(stats.rate || 0).toFixed(1);
  document.getElementById("stat-last").textContent = stats.last_route_time == null ? "--" : `${Number(stats.last_route_time).toFixed(2)}s`;
  document.getElementById("speed").textContent = `SPEED ${world.speed_multiplier || 1}x`;
  document.getElementById("run-state").textContent = world.running ? "RUNNING" : "STOPPED";
  document.getElementById("run-state").style.color = world.running ? "var(--green)" : "var(--yellow)";

  const cloud = document.getElementById("cloud");
  const offline = world.connection_status === "offline";
  cloud.textContent = offline ? "RECONNECT CLOUD" : "DISCONNECT CLOUD";
  cloud.classList.toggle("online", offline);

  const endpointLines = String((info && info.endpoints) || world.inference_target || "").split("\n").slice(0, 4);
  document.getElementById("endpoints").textContent = endpointLines.join("\n") || "Inference target unavailable";

  const log = document.getElementById("log");
  const thoughts = (world.thought_log || []).slice(-36).reverse();
  const sig = thoughts.length + ":" + (thoughts[0]?.timestamp || 0);
  if (log.dataset.sig !== sig) {
    log.dataset.sig = sig;
    log.innerHTML = "";
    thoughts.forEach((entry, idx) => {
      const row = document.createElement("div");
      const type = String(entry.type || "OBSERVE");
      row.className = "log-row";
      row.style.opacity = String(Math.max(0.32, 1 - idx * 0.035));
      const elapsed = Number(entry.elapsed || 0);
      const ts = `${String(Math.floor(elapsed / 60)).padStart(2, "0")}:${String(Math.floor(elapsed % 60)).padStart(2, "0")}.${String(Math.floor((elapsed % 1) * 100)).padStart(2, "0")}`;
      row.innerHTML = `<span class="ts">${ts}</span><span class="type-${type}">[${type}]</span><span>${escapeHtml(entry.agent || "Leader")}: ${escapeHtml(entry.content || "")}</span>`;
      log.appendChild(row);
    });
  }

  const workers = document.getElementById("workers");
  workers.innerHTML = "";
  (world.workers || []).slice(0, 6).forEach((worker) => {
    const row = document.createElement("div");
    row.className = "worker-row";
    row.innerHTML = `<strong>${escapeHtml(worker.name || ("Worker-" + worker.id))}</strong><span>${escapeHtml(workerStatus(worker, world))}</span>`;
    workers.appendChild(row);
  });
}

function workerStatus(worker, world) {
  const carry = worker.carrying ? ` [carrying ${worker.carrying.color}]` : "";
  if (worker.status === "to_pickup") {
    const f = (world.factories || []).find((item) => item.id === worker.target_factory_id);
    return `en route to ${(f && f.name) || "factory"}${carry}`;
  }
  if (worker.status === "to_dropbox") {
    const b = (world.dropboxes || []).find((item) => item.id === worker.target_dropbox_id);
    return `en route to ${(b && b.name) || "drop box"}${carry}`;
  }
  return "idle, awaiting assignment";
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]));
}

async function pollState() {
  try {
    const response = await fetch(STATE_URL, { cache: "no-store" });
    if (!response.ok) return;
    const data = await response.json();
    const world = data.world || {};
    syncScene(world);
    updatePanel(world, data.info || {});
  } catch {
    // The server may be starting or stopping; the next poll will retry.
  }
}
setInterval(pollState, 100);
pollState();

async function sendAction(payload) {
  try {
    await fetch(ACTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (err) {
    console.warn("action failed", err);
  }
}

document.getElementById("start").addEventListener("click", () => sendAction({ type: "start" }));
document.getElementById("stop").addEventListener("click", () => sendAction({ type: "stop" }));
document.getElementById("reset").addEventListener("click", () => sendAction({ type: "reset" }));
document.getElementById("speed").addEventListener("click", () => sendAction({ type: "speed_toggle" }));
document.getElementById("cloud").addEventListener("click", () => {
  sendAction({ type: latestWorld.connection_status === "offline" ? "reconnect" : "disconnect" });
});

const btnCursor = document.getElementById("mode-cursor");
const btnBuilder = document.getElementById("mode-builder");
const tools = document.getElementById("builder-tools");

function setMode(next) {
  mode = next;
  btnCursor.classList.toggle("active", mode === "cursor");
  btnBuilder.classList.toggle("active", mode === "builder");
  tools.classList.toggle("active", mode === "builder");
  controls.enabled = mode !== "builder";
  preview.visible = mode === "builder";
  renderer.domElement.style.cursor = mode === "builder" ? "crosshair" : "";
  sendAction({ type: mode === "builder" ? "mode_builder" : "mode_cursor" });
}

btnCursor.addEventListener("click", () => setMode("cursor"));
btnBuilder.addEventListener("click", () => setMode("builder"));

tools.querySelectorAll("button").forEach((button) => {
  button.addEventListener("click", () => {
    builderTool = button.dataset.tool;
    tools.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
    rebuildPreview();
    sendAction({ type: `builder_${builderTool}` });
  });
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let preview = makePreview("wall");
scene.add(preview);
preview.visible = false;

function makePreview(tool) {
  const group = new THREE.Group();
  group.userData.tool = tool;
  const mat = new THREE.MeshBasicMaterial({ color: COLORS.accent, transparent: true, opacity: 0.45, wireframe: tool !== "worker" });
  if (tool === "factory") {
    group.add(new THREE.Mesh(new THREE.BoxGeometry(3, 1.4, 3), mat));
    group.children[0].position.set(1.5, 0.7, 1.5);
    const belt = new THREE.Mesh(new THREE.BoxGeometry(5, 0.18, 0.9), mat.clone());
    belt.position.set(5.5, 0.15, 1.5);
    group.add(belt);
  } else if (tool === "dropbox") {
    const box = new THREE.Mesh(new THREE.BoxGeometry(3, 0.9, 2), mat);
    box.position.set(1.5, 0.45, 1);
    group.add(box);
  } else if (tool === "worker") {
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.48, 18, 12), mat);
    ball.position.set(0.5, 0.48, 0.5);
    group.add(ball);
  } else {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 1.1, 1), mat);
    wall.position.set(0.5, 0.55, 0.5);
    group.add(wall);
  }
  return group;
}

function rebuildPreview() {
  scene.remove(preview);
  disposeObject(preview);
  preview = makePreview(builderTool);
  applyPreviewRotation();
  scene.add(preview);
  preview.visible = mode === "builder";
}

function activeBuilderRotationY() {
  return builderRotationY[builderTool] || 0;
}

function applyPreviewRotation() {
  preview.rotation.x = 0;
  preview.rotation.y = (builderTool === "factory" || builderTool === "dropbox")
    ? activeBuilderRotationY()
    : 0;
}

function eventToCell(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(pickPlane, false);
  if (!hits.length) return null;
  const p = hits[0].point;
  const x = Math.floor(p.x);
  const y = Math.floor(p.z);
  if (x < 0 || x >= GRID || y < 0 || y >= GRID) return null;
  return [x, y];
}

function actionForPlacement(cell) {
  if (builderTool === "factory") {
    return { type: "place_factory", cell, color: nextFactoryColor(), rotation_y: activeBuilderRotationY() };
  }
  if (builderTool === "dropbox") {
    return { type: "place_dropbox", cell, color: nextDropBoxColor(), rotation_y: activeBuilderRotationY() };
  }
  if (builderTool === "worker") return { type: "place_worker", cell };
  return { type: "wall_add", cell };
}

function nextFactoryColor() {
  const names = Object.keys(colorFallback);
  return names[(latestWorld.factories || []).length % names.length];
}

function nextDropBoxColor() {
  const factories = (latestWorld.factories || []).map((item) => item.color);
  const boxes = (latestWorld.dropboxes || []).map((item) => item.color);
  for (const color of factories) {
    if (!boxes.includes(color)) return color;
  }
  return factories.length ? factories[boxes.length % factories.length] : nextFactoryColor();
}

renderer.domElement.addEventListener("contextmenu", (event) => {
  if (mode === "builder") event.preventDefault();
});

window.addEventListener("keydown", (event) => {
  const target = event.target;
  if (target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName)) return;
  if (event.key.toLowerCase() !== "r") return;
  if (mode !== "builder" || (builderTool !== "factory" && builderTool !== "dropbox")) return;
  event.preventDefault();
  builderRotationY[builderTool] = (activeBuilderRotationY() + ROTATION_STEP_Y) % (Math.PI * 2);
  applyPreviewRotation();
});

renderer.domElement.addEventListener("pointermove", (event) => {
  if (mode !== "builder") return;
  const cell = eventToCell(event);
  if (!cell) {
    preview.visible = false;
    return;
  }
  preview.visible = true;
  preview.position.set(cell[0], 0.04, cell[1]);
  if (painting && builderTool === "wall" && (event.buttons & 1)) {
    const keyName = cell[0] + "," + cell[1];
    if (!painted.has(keyName)) {
      painted.add(keyName);
      sendAction({ type: "wall_add", cell });
    }
  }
});

renderer.domElement.addEventListener("pointerdown", (event) => {
  if (mode !== "builder") return;
  const cell = eventToCell(event);
  if (!cell) return;
  if (event.button === 2) {
    sendAction({ type: "wall_remove", cell });
    return;
  }
  if (event.button !== 0) return;
  if (builderTool === "wall") {
    painting = true;
    painted.clear();
    painted.add(cell[0] + "," + cell[1]);
  }
  sendAction(actionForPlacement(cell));
});

renderer.domElement.addEventListener("pointerup", () => {
  painting = false;
  painted.clear();
});

renderer.domElement.addEventListener("pointerleave", () => {
  preview.visible = false;
  painting = false;
  painted.clear();
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const lerp = 1 - Math.exp(-dt * 10);
  const t = clock.elapsedTime;

  for (const [id, group] of workerMeshes) {
    const visual = workerVisualPos.get(id);
    if (!visual || !visual.target) continue;
    visual.x += (visual.target.x - visual.x) * lerp;
    visual.z += (visual.target.z - visual.z) * lerp;
    group.position.set(visual.x, 0, visual.z);
    group.userData.ring.rotation.z += dt * 1.8;
    const worker = (latestWorld.workers || []).find((item) => item.id === id);
    if (worker && worker.status === "idle") {
      const pulse = 1 + Math.sin(t * 2 + id) * 0.08;
      group.userData.body.scale.setScalar(pulse);
    } else {
      group.userData.body.scale.setScalar(1);
    }
  }

  for (const group of factoryMeshes.values()) {
    const factory = group.userData.factory;
    const beltLength = factory ? factory.belt_length || 5 : 5;
    const dashes = group.userData.dashes || [];
    dashes.forEach((dash, idx) => {
      const cycle = ((t * 1.7 + idx * 0.72) % beltLength);
      dash.position.x = 3.2 + cycle;
    });
  }

  if (leaderMesh) {
    const thinking = latestWorld.leader_thinking || (latestWorld.leader && latestWorld.leader.thinking);
    const pulse = thinking ? 1.0 + Math.sin(t * 5) * 0.22 : 1.0 + Math.sin(t * 1.5) * 0.05;
    leaderMesh.userData.glow.scale.setScalar(pulse);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  camera.aspect = Math.max(1, w) / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
new ResizeObserver(resize).observe(stage);
resize();
</script>
