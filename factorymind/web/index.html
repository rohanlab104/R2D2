<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FactoryMind R2D2 — 3D viewer</title>
<style>
  :root {
    --bg: #08080f;
    --panel: #0c0c18;
    --edge: #1c1c38;
    --text: #e0e0e0;
    --dim: #6a6a8a;
    --accent: #00d4ff;
    --leader: #00d4ff;
    --worker: #ff8c00;
    --strategy: #dc00ff;
    --error: #ffc800;
    --ok: #00ff88;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    overflow: hidden;
  }
  #stage { position: absolute; inset: 0 380px 0 0; }
  #panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 380px;
    background: var(--panel);
    border-left: 1px solid var(--edge);
    display: flex; flex-direction: column;
    padding: 14px;
    gap: 10px;
    overflow: hidden;
  }
  #title {
    color: var(--accent);
    font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
  }
  .subtitle { color: var(--dim); font-size: 10px; margin-top: 2px; }
  hr.rule { border: none; border-top: 1px solid var(--edge); margin: 4px 0; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .tile {
    background: #14142a; border: 1px solid #28284a; border-radius: 4px;
    padding: 6px 4px; text-align: center; min-height: 50px;
  }
  .tile .label { color: var(--dim); font-size: 9px; letter-spacing: 0.08em; }
  .tile .value { color: var(--accent); font-size: 17px; font-weight: 700; line-height: 1.2; }
  .tile .sub { color: var(--dim); font-size: 9px; }
  .row { display: flex; gap: 6px; }
  .btn {
    flex: 1;
    background: #14142a; border: 1px solid #28284a;
    color: var(--dim); padding: 7px 8px; border-radius: 4px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.08em;
    cursor: pointer; text-align: center;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { color: var(--accent); border-color: var(--accent); background: #0f1830; }
  .btn.danger { border-color: #501a1a; color: #d05a5a; }
  .btn.danger:hover { background: #2a0a0a; }
  .btn.ok { border-color: #1a4a2a; color: #5acc7a; }
  #log {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    background: #0a0a18;
    border: 1px solid var(--edge); border-radius: 4px;
    padding: 6px; font-size: 10px; line-height: 1.5;
  }
  #log .row { display: block; padding: 1px 0; opacity: 1; }
  #log .ts   { color: var(--dim); }
  #log .src  { color: var(--dim); margin-right: 4px; }
  #log .msg  { color: #c8c8d8; }
  .type-CLAIM      { color: var(--accent); }
  .type-STRATEGY   { color: var(--strategy); }
  .type-BOTTLENECK { color: var(--error); }
  .type-COMPLETE   { color: var(--ok); }
  .type-INTENT     { color: #b0b0c0; }
  .type-REASONING  { color: var(--strategy); }
  .type-ERROR      { color: var(--error); }
  .type-USER       { color: #fff; font-weight: 700; }
  .type-POLICY     { color: #00ffc8; font-weight: 600; }
  #chat-row { display: flex; gap: 6px; }
  #chat-input {
    flex: 1;
    background: #10101e; border: 1px solid #2a2a55; border-radius: 4px;
    color: var(--text); padding: 8px 10px;
    font-family: inherit; font-size: 12px;
  }
  #chat-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: #0a1428; border: 1px solid #284060;
    color: var(--accent); padding: 8px 16px; border-radius: 4px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.1em;
    cursor: pointer;
  }
  #send-btn:hover { background: #112038; border-color: var(--accent); }
  #endpoints { color: var(--dim); font-size: 10px; white-space: pre-wrap; }
  #endpoints b { color: #b8b8c8; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 9px; letter-spacing: 0.08em; }
  .badge.online  { background: #0a2818; color: #5acc7a; }
  .badge.offline { background: #2a0a0a; color: #d05a5a; }
  .badge.mock    { background: #2a1a0a; color: #ddaa55; }
  #hint {
    position: absolute; left: 12px; bottom: 12px;
    color: var(--dim); font-size: 10px; pointer-events: none;
  }
  #hint b { color: #c8c8d8; font-weight: 600; }
  #status-bar {
    position: absolute; left: 12px; top: 12px;
    display: flex; gap: 8px; align-items: center;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="stage"></div>

<div id="status-bar">
  <span id="conn-badge" class="badge online">ONLINE</span>
  <span id="mock-badge" class="badge mock" style="display:none">MOCK</span>
</div>

<div id="hint">
  <b>cursor</b>: drag rotate · scroll zoom · right-drag pan<br />
  <b>builder</b>: left-click/drag add · right-click remove
</div>

<div id="panel">
  <div>
    <div id="title">FACTORYMIND <span style="font-weight:400;color:var(--dim);">3D</span></div>
    <div class="subtitle">Nemotron + DGX Spark GX10</div>
  </div>
  <hr class="rule" />

  <div class="stats">
    <div class="tile"><div class="label">COMPLETED</div><div class="value" id="s-completed">0</div></div>
    <div class="tile"><div class="label">TIME</div>     <div class="value" id="s-time">00:00</div></div>
    <div class="tile"><div class="label">RATE/MIN</div> <div class="value" id="s-rate">0.0</div></div>
    <div class="tile">
      <div class="label">LAST ROUTE</div>
      <div class="value" id="s-last">--</div>
      <div class="sub" id="s-avg"></div>
    </div>
    <div class="tile">
      <div class="label">FLEET QUEUE</div>
      <div class="value" id="s-queue">0</div>
      <div class="sub" id="s-queue-total"></div>
    </div>
    <div class="tile">
      <div class="label">NEMOCLAW</div>
      <div class="value" id="s-claw">--</div>
      <div class="sub" id="s-claw-mode"></div>
    </div>
  </div>

  <div class="row">
    <button class="btn active" id="btn-mode-cursor">✦ CURSOR</button>
    <button class="btn" id="btn-mode-builder">✏ BUILDER</button>
  </div>
  <div class="row">
    <button class="btn" id="btn-reset">RESET</button>
    <button class="btn" id="btn-speed">SPEED 1x →</button>
    <button class="btn danger" id="btn-disconnect">FORCE LOCAL NIM</button>
  </div>

  <hr class="rule" />
  <div id="endpoints">connecting…</div>

  <hr class="rule" />
  <div style="color: var(--accent); font-size: 11px; letter-spacing: 0.08em;">AGENT REASONING</div>
  <div id="log"></div>

  <div id="chat-row">
    <input id="chat-input" placeholder="e.g. 'do 100 deliveries' or 'take Parts to QA'…" autocomplete="off" />
    <button id="send-btn">SEND</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const GRID = 50;
const STATE_URL  = "/state.json";
const ACTION_URL = "/action";
const LEADER_COLOR = 0x00d4ff;
const WORKER_COLOR = 0xff8c00;
const WS_LIGHT = { Parts: 0xff5050, Assembly: 0x5080ff, QA: 0x44dd66, Shipping: 0xffcc44 };

// ---------------------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------------------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06060e);
scene.fog = new THREE.Fog(0x06060e, GRID * 1.6, GRID * 4.0);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
camera.position.set(GRID * 1.05, GRID * 1.1, GRID * 1.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(GRID / 2, 0, GRID / 2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 12;
controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * 0.49;

// Lights
scene.add(new THREE.AmbientLight(0x404060, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left   = -GRID;
sun.shadow.camera.right  =  GRID * 1.5;
sun.shadow.camera.top    =  GRID * 1.5;
sun.shadow.camera.bottom = -GRID;
sun.shadow.camera.near = 1;
sun.shadow.camera.far  = 220;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4488ff, 0.45);
rim.position.set(-30, 60, -40);
scene.add(rim);

// ---------------------------------------------------------------------------
// Factory environment — built once at startup. Everything outside the playable
// 0..GRID area is purely decorative and never affects pathfinding.
// ---------------------------------------------------------------------------
const PAD = 14;                 // outer concrete apron beyond playable area
const WALL_H = 4.0;             // perimeter wall height
const PERIM_OFFSET = 1.5;       // perimeter wall sits just outside the floor

// Polished factory floor (slightly lighter, glossy concrete).
{
  const geo = new THREE.PlaneGeometry(GRID, GRID, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x1a1a30, metalness: 0.2, roughness: 0.75,
  });
  const floor = new THREE.Mesh(geo, mat);
  floor.position.set(GRID / 2, 0, GRID / 2);
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(GRID, 50, 0x2a2a52, 0x18182e);
  grid.position.set(GRID / 2, 0.02, GRID / 2);
  scene.add(grid);
}

// Outer concrete apron (the area the buildings sit on).
{
  const geo = new THREE.PlaneGeometry(GRID + PAD * 2, GRID + PAD * 2);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x0c0c16, metalness: 0.05, roughness: 0.95,
  });
  const apron = new THREE.Mesh(geo, mat);
  apron.position.set(GRID / 2, -0.12, GRID / 2);
  apron.receiveShadow = true;
  scene.add(apron);

  // Painted rim around the playable floor (slight "shop floor" highlight).
  const rimGeo = new THREE.BoxGeometry(GRID + 1, 0.18, GRID + 1);
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x1f1f3a, roughness: 0.55 });
  const rimMesh = new THREE.Mesh(rimGeo, rimMat);
  rimMesh.position.set(GRID / 2, -0.06, GRID / 2);
  rimMesh.receiveShadow = true;
  scene.add(rimMesh);
}

// ---------------------------------------------------------------------------
// Reusable prop builders
// ---------------------------------------------------------------------------
const matWallSteel = new THREE.MeshStandardMaterial({
  color: 0x1c1c30, roughness: 0.65, metalness: 0.45,
});
const matWallPanel = new THREE.MeshStandardMaterial({
  color: 0x252540, roughness: 0.6, metalness: 0.5,
});
const matPillar = new THREE.MeshStandardMaterial({
  color: 0x2a2a44, roughness: 0.55, metalness: 0.55,
});
const matHazard = new THREE.MeshStandardMaterial({
  color: 0xffb000, emissive: 0xffb000, emissiveIntensity: 0.55, roughness: 0.4,
});
const matTruss = new THREE.MeshStandardMaterial({
  color: 0x3a3a55, roughness: 0.5, metalness: 0.7,
});
const matLightStrip = new THREE.MeshBasicMaterial({ color: 0xfff4d8 });
const matCrateRed = new THREE.MeshStandardMaterial({
  color: 0x9a3030, roughness: 0.85, metalness: 0.05,
});
const matCrateWood = new THREE.MeshStandardMaterial({
  color: 0x6b4626, roughness: 0.95, metalness: 0.02,
});
const matDrum = new THREE.MeshStandardMaterial({
  color: 0x1f5a1f, roughness: 0.45, metalness: 0.6,
});
const matDrumLid = new THREE.MeshStandardMaterial({
  color: 0x0d2a0d, roughness: 0.7, metalness: 0.4,
});
const matCone = new THREE.MeshStandardMaterial({
  color: 0xff7a18, emissive: 0xff5a00, emissiveIntensity: 0.4, roughness: 0.5,
});
const matCharger = new THREE.MeshStandardMaterial({
  color: 0x10324a, roughness: 0.4, metalness: 0.7,
  emissive: 0x00d4ff, emissiveIntensity: 0.35,
});
const matChargerCap = new THREE.MeshBasicMaterial({ color: 0x00d4ff });
const matTruckBody = new THREE.MeshStandardMaterial({
  color: 0xe6c84a, roughness: 0.55, metalness: 0.35,
});
const matTruckCab = new THREE.MeshStandardMaterial({
  color: 0xb89a30, roughness: 0.5, metalness: 0.4,
});
const matTruckTire = new THREE.MeshStandardMaterial({
  color: 0x101018, roughness: 0.95, metalness: 0.05,
});

function makeFloorLabel(text, color = "#ffffff", scale = 4.0) {
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext("2d");
  ctx.font = "bold 88px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = "rgba(0,0,0,0.8)";
  ctx.shadowBlur = 12;
  ctx.fillText(text, 256, 70);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, depthWrite: false,
  });
  const geo = new THREE.PlaneGeometry(scale, scale * (canvas.height / canvas.width));
  geo.rotateX(-Math.PI / 2);
  return new THREE.Mesh(geo, mat);
}

function makePalletStack(count = 3, crateMat = matCrateWood) {
  const g = new THREE.Group();
  // Wooden pallet base
  const palletMat = new THREE.MeshStandardMaterial({ color: 0x4d2f15, roughness: 0.95 });
  const pallet = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, 2.0), palletMat);
  pallet.position.y = 0.1;
  pallet.castShadow = true; pallet.receiveShadow = true;
  g.add(pallet);
  // Stacked crates
  for (let i = 0; i < count; i++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 1.6), crateMat);
    c.position.set(
      (Math.random() - 0.5) * 0.15,
      0.2 + 0.45 + i * 0.95,
      (Math.random() - 0.5) * 0.15,
    );
    c.rotation.y = (Math.random() - 0.5) * 0.15;
    c.castShadow = true; c.receiveShadow = true;
    g.add(c);
  }
  return g;
}

function makeDrum() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.1, 18), matDrum);
  body.position.y = 0.55;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.06, 18), matDrumLid);
  lid.position.y = 1.13;
  g.add(lid);
  // Faint horizontal band
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.08, 18), matDrumLid);
  band.position.y = 0.55;
  g.add(band);
  return g;
}

function makeCone() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.6), matDrumLid);
  base.position.y = 0.04;
  base.castShadow = true;
  g.add(base);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 14), matCone);
  cone.position.y = 0.43;
  cone.castShadow = true;
  g.add(cone);
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.27, 0.08, 14),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  stripe.position.y = 0.45;
  g.add(stripe);
  return g;
}

function makeCornerPillar(x, z) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(1.6, WALL_H + 1.2, 1.6), matPillar);
  shaft.position.set(x, (WALL_H + 1.2) / 2, z);
  shaft.castShadow = true; shaft.receiveShadow = true;
  g.add(shaft);
  // Hazard cap
  const hat = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.35, 1.85), matHazard);
  hat.position.set(x, WALL_H + 1.2, z);
  g.add(hat);
  // Hazard skirt
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 1.8), matHazard);
  skirt.position.set(x, 0.2, z);
  g.add(skirt);
  return g;
}

function makeTruck(x, z, rotY = 0) {
  const g = new THREE.Group();
  // Trailer
  const trailer = new THREE.Mesh(new THREE.BoxGeometry(6.5, 2.4, 2.6), matTruckBody);
  trailer.position.set(0, 1.5, 0);
  trailer.castShadow = true; trailer.receiveShadow = true;
  g.add(trailer);
  // Cab
  const cab = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.0, 2.4), matTruckCab);
  cab.position.set(4.4, 1.3, 0);
  cab.castShadow = true; cab.receiveShadow = true;
  g.add(cab);
  // Windshield
  const wind = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.0, 1.9),
    new THREE.MeshStandardMaterial({
      color: 0x88c8ff, transparent: true, opacity: 0.55,
      roughness: 0.1, metalness: 0.6,
    }));
  wind.position.set(5.6, 1.7, 0);
  g.add(wind);
  // Tires
  for (const [tx, tz] of [[-2.2, 1.45], [-2.2, -1.45], [1.0, 1.45], [1.0, -1.45], [4.0, 1.45], [4.0, -1.45]]) {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 16), matTruckTire);
    t.rotation.x = Math.PI / 2;
    t.position.set(tx, 0.5, tz);
    g.add(t);
  }
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  return g;
}

// ---------------------------------------------------------------------------
// Build perimeter, pillars, trusses, and scattered outdoor props
// ---------------------------------------------------------------------------
{
  const half = GRID / 2;
  const wallSpan = GRID + PERIM_OFFSET * 2 + 4;

  // Four perimeter walls (with gaps left near the corners as bay openings).
  // We render each side as two segments around a central gap to suggest a
  // loading-dock door near the corner workstations.
  const segLen = (GRID + PERIM_OFFSET * 2) / 2 - 4;

  function makeSeg(w, h, d, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWallSteel);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    return m;
  }

  // North (z = -PERIM_OFFSET)
  makeSeg(segLen, WALL_H, 0.6, half - segLen / 2 - 4, WALL_H / 2, -PERIM_OFFSET);
  makeSeg(segLen, WALL_H, 0.6, half + segLen / 2 + 4, WALL_H / 2, -PERIM_OFFSET);
  // South
  makeSeg(segLen, WALL_H, 0.6, half - segLen / 2 - 4, WALL_H / 2, GRID + PERIM_OFFSET);
  makeSeg(segLen, WALL_H, 0.6, half + segLen / 2 + 4, WALL_H / 2, GRID + PERIM_OFFSET);
  // West
  makeSeg(0.6, WALL_H, segLen, -PERIM_OFFSET, WALL_H / 2, half - segLen / 2 - 4);
  makeSeg(0.6, WALL_H, segLen, -PERIM_OFFSET, WALL_H / 2, half + segLen / 2 + 4);
  // East
  makeSeg(0.6, WALL_H, segLen, GRID + PERIM_OFFSET, WALL_H / 2, half - segLen / 2 - 4);
  makeSeg(0.6, WALL_H, segLen, GRID + PERIM_OFFSET, WALL_H / 2, half + segLen / 2 + 4);

  // Corner pillars (just outside the playable area, between wall segments).
  scene.add(makeCornerPillar(-PERIM_OFFSET,        -PERIM_OFFSET));
  scene.add(makeCornerPillar(GRID + PERIM_OFFSET,  -PERIM_OFFSET));
  scene.add(makeCornerPillar(-PERIM_OFFSET,        GRID + PERIM_OFFSET));
  scene.add(makeCornerPillar(GRID + PERIM_OFFSET,  GRID + PERIM_OFFSET));

  // Overhead trusses with light strips spanning the bay.
  for (let z = 6; z < GRID; z += 12) {
    const truss = new THREE.Mesh(
      new THREE.BoxGeometry(GRID + 4, 0.22, 0.5),
      matTruss,
    );
    truss.position.set(GRID / 2, WALL_H + 0.6, z);
    truss.castShadow = false;
    scene.add(truss);

    const strip = new THREE.Mesh(
      new THREE.BoxGeometry(GRID, 0.05, 0.18),
      matLightStrip,
    );
    strip.position.set(GRID / 2, WALL_H + 0.45, z);
    scene.add(strip);
  }

  // Decorative props scattered OUTSIDE the playable area only — never in 0..GRID.
  // A tiny deterministic PRNG so the layout is stable across reloads.
  let _seed = 1337;
  const rand = () => { _seed = (_seed * 9301 + 49297) % 233280; return _seed / 233280; };

  const outsidePoints = [
    // West strip (parts side)
    { x: -5, z: 6 },  { x: -7, z: 12 }, { x: -5, z: 18 },
    { x: -6, z: 30 }, { x: -7, z: 38 }, { x: -5, z: 44 },
    // East strip (assembly / qa side)
    { x: GRID + 5, z: 7 },  { x: GRID + 7, z: 13 },
    { x: GRID + 5, z: 26 }, { x: GRID + 7, z: 33 }, { x: GRID + 5, z: 41 },
    // North strip
    { x: 10, z: -5 }, { x: 18, z: -7 }, { x: 30, z: -5 }, { x: 40, z: -7 },
    // South strip
    { x: 12, z: GRID + 6 }, { x: 22, z: GRID + 7 },
    { x: 32, z: GRID + 5 }, { x: 41, z: GRID + 6 },
  ];

  for (const p of outsidePoints) {
    const r = rand();
    let prop;
    if (r < 0.4) {

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function gridToWorld(gx, gy) {
  return { x: gx + 0.5, z: gy + 0.5 };
}

function makeLabelSprite(text, color = "#ffffff", scale = 1.2) {
  const canvas = document.createElement("canvas");
  canvas.width = 256; canvas.height = 96;
  const ctx = canvas.getContext("2d");
  ctx.font = "bold 56px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = 8;
  ctx.fillText(text, 128, 50);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(scale * 3.0, scale, 1);
  return spr;
}

// ---------------------------------------------------------------------------
// Sync functions: take latest world snapshot, mutate scene to match
// ---------------------------------------------------------------------------
function syncWalls(world) {
  const seen = new Set();
  for (const cell of world.wall ?? []) {
    const wx = cell[0], wy = cell[1];
    const key = wx + "," + wy;
    seen.add(key);
    if (!wallMeshes.has(key)) {
      const geo = new THREE.BoxGeometry(1, 1.4, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x3a3a66, roughness: 0.55, metalness: 0.25,
      });
      const m = new THREE.Mesh(geo, mat);
      const w = gridToWorld(wx, wy);
      m.position.set(w.x, 0.7, w.z);
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
      wallMeshes.set(key, m);
    }
  }
  for (const [key, m] of wallMeshes) {
    if (!seen.has(key)) {
      scene.remove(m);
      m.geometry.dispose(); m.material.dispose();
      wallMeshes.delete(key);
    }
  }
}

function syncWorkstations(world) {
  for (const ws of world.workstations ?? []) {
    if (wsMeshes.has(ws.name)) continue;
    const group = new THREE.Group();
    const tint = new THREE.Color(`rgb(${ws.color[0]},${ws.color[1]},${ws.color[2]})`);
    const hex  = `rgb(${ws.color[0]},${ws.color[1]},${ws.color[2]})`;

    _buildBaseAndLabel(group, ws, tint, hex);
    const builder = _STATION_BUILDERS[ws.name];
    if (builder) builder(group, tint, hex);

    const w = gridToWorld(ws.pos[0], ws.pos[1]);
    group.position.set(w.x, 0, w.z);
    scene.add(group);
    wsMeshes.set(ws.name, group);
  }
}

// ---------------------------------------------------------------------------
// Designated zones — colored floor patches + painted floor labels around each
// workstation. Built once when the world data first arrives.
// ---------------------------------------------------------------------------
const ZONE_HALF = 4;             // 8x8 painted area (stays inside the grid)
let _zonesBuilt = false;
function syncDesignatedZones(world) {
  if (_zonesBuilt) return;
  if (!world.workstations || world.workstations.length === 0) return;
  for (const ws of world.workstations) {
    const c = ws.color;
    const tint = new THREE.Color(`rgb(${c[0]},${c[1]},${c[2]})`);

    // Colored zone tint on the floor.
    const zoneGeo = new THREE.PlaneGeometry(ZONE_HALF * 2, ZONE_HALF * 2);
    zoneGeo.rotateX(-Math.PI / 2);
    const zoneMat = new THREE.MeshBasicMaterial({
      color: tint, transparent: true, opacity: 0.16, depthWrite: false,
    });
    const zone = new THREE.Mesh(zoneGeo, zoneMat);
    const w = gridToWorld(ws.pos[0], ws.pos[1]);
    // Clamp the zone so it stays within the playable area.
    const zx = Math.min(Math.max(w.x, ZONE_HALF), GRID - ZONE_HALF);
    const zz = Math.min(Math.max(w.z, ZONE_HALF), GRID - ZONE_HALF);
    zone.position.set(zx, 0.04, zz);
    scene.add(zone);

    // Hazard chevron border around the zone.
    const stripeMat = new THREE.MeshBasicMaterial({
      color: 0xffd633, transparent: true, opacity: 0.55, depthWrite: false,
    });
    for (const [dx, dz, sw, sd] of [
      [0, -ZONE_HALF, ZONE_HALF * 2, 0.32],
      [0,  ZONE_HALF, ZONE_HALF * 2, 0.32],
      [-ZONE_HALF, 0, 0.32, ZONE_HALF * 2],
      [ ZONE_HALF, 0, 0.32, ZONE_HALF * 2],
    ]) {
      const sg = new THREE.PlaneGeometry(sw, sd);
      sg.rotateX(-Math.PI / 2);
      const s = new THREE.Mesh(sg, stripeMat);
      s.position.set(zx + dx, 0.05, zz + dz);
      scene.add(s);
    }

    // Floor label, offset toward the interior so it's visible from above.
    const interiorOffsetX = (zx > GRID / 2 ? -1 : 1) * (ZONE_HALF - 1.6);
    const interiorOffsetZ = (zz > GRID / 2 ? -1 : 1) * (ZONE_HALF - 1.6);
    const lbl = makeFloorLabel(ws.name.toUpperCase(),
      `rgb(${c[0]},${c[1]},${c[2]})`, 5.5);
    lbl.position.set(zx + interiorOffsetX, 0.07, zz + interiorOffsetZ);
    scene.add(lbl);
  }
  _zonesBuilt = true;
}

// ---------------------------------------------------------------------------
// Charging / dispatch area — sits over the spawn cells in the middle of the
// floor. Built once when spawn_positions first arrive.
// ---------------------------------------------------------------------------
let _chargingBuilt = false;
function syncChargingArea(world) {
  if (_chargingBuilt) return;
  const spawns = world.spawn_positions ?? [];
  if (spawns.length === 0) return;

  // Compute bounding box around the spawn block.
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const sp of spawns) {
    minX = Math.min(minX, sp[0]);
    maxX = Math.max(maxX, sp[0]);
    minZ = Math.min(minZ, sp[1]);
    maxZ = Math.max(maxZ, sp[1]);
  }
  const cx = (minX + maxX) / 2 + 0.5;
  const cz = (minZ + maxZ) / 2 + 0.5;
  const w  = (maxX - minX) + 4;
  const h  = (maxZ - minZ) + 4;

  // Floor patch
  const patchGeo = new THREE.PlaneGeometry(w, h);
  patchGeo.rotateX(-Math.PI / 2);
  const patch = new THREE.Mesh(patchGeo, new THREE.MeshBasicMaterial({
    color: 0x00d4ff, transparent: true, opacity: 0.10, depthWrite: false,
  }));
  patch.position.set(cx, 0.04, cz);
  scene.add(patch);

  // Hazard stripe border
  const stripeMat = new THREE.MeshBasicMaterial({
    color: 0x00d4ff, transparent: true, opacity: 0.45, depthWrite: false,
  });
  for (const [dx, dz, sw, sd] of [
    [0, -h / 2, w, 0.26],
    [0,  h / 2, w, 0.26],
    [-w / 2, 0, 0.26, h],
    [ w / 2, 0, 0.26, h],
  ]) {
    const sg = new THREE.PlaneGeometry(sw, sd);
    sg.rotateX(-Math.PI / 2);
    const s = new THREE.Mesh(sg, stripeMat);
    s.position.set(cx + dx, 0.05, cz + dz);
    scene.add(s);
  }

  // Floor label
  const lbl = makeFloorLabel("CHARGING / DISPATCH", "#9bf0ff", 7.0);
  lbl.position.set(cx, 0.07, cz - h / 2 - 0.2);
  scene.add(lbl);

  // Charging dock posts at each spawn cell.
  for (const sp of spawns) {
    const wp = gridToWorld(sp[0], sp[1]);
    const dock = new THREE.Group();
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 0.7, 0.32),
      matCharger,
    );
    post.position.y = 0.35;
    post.castShadow = true;
    dock.add(post);
    const cap = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.05, 0.4),
      matChargerCap,
    );
    cap.position.y = 0.72;
    dock.add(cap);
    // Position next to the spawn cell so it doesn't clip the robot.
    dock.position.set(wp.x - 0.45, 0, wp.z - 0.45);
    scene.add(dock);
  }
  _chargingBuilt = true;
}

function syncRobots(world) {
  const seen = new Set();
  for (const r of world.robots ?? []) {
    seen.add(r.id);
    let g = robotMeshes.get(r.id);
    const isLeader = r.role === "LEADER";
    const color = isLeader ? LEADER_COLOR : WORKER_COLOR;
    const radius = isLeader ? 0.55 : 0.45;
    if (!g) {
      g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 28, 18),
        new THREE.MeshStandardMaterial({
          color, emissive: color, emissiveIntensity: 0.55,
          roughness: 0.25, metalness: 0.5,
        }),
      );
      body.castShadow = true;
      body.position.y = radius;
      g.add(body);

      const ringGeo = new THREE.RingGeometry(radius * 1.4, radius * 1.7, 32);
      ringGeo.rotateX(-Math.PI / 2);
      const ring = new THREE.Mesh(
        ringGeo,
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, side: THREE.DoubleSide }),
      );
      ring.position.y = 0.05;
      g.add(ring);
      g.userData.ring = ring;

      const lbl = makeLabelSprite(`${isLeader ? "L" : "W"}${r.id}`, "#ffffff", 0.55);
      lbl.position.set(0, radius * 2 + 0.4, 0);
      g.add(lbl);

      scene.add(g);
      robotMeshes.set(r.id, g);
    }
    const target = gridToWorld(r.pos[0], r.pos[1]);
    let v = robotVisualPos.get(r.id);
    if (!v) {
      v = { x: target.x, z: target.z, target };
      robotVisualPos.set(r.id, v);
    } else {
      v.target = target;
    }
  }
  for (const [id, g] of robotMeshes) {
    if (!seen.has(id)) {
      scene.remove(g);
      robotMeshes.delete(id);
      robotVisualPos.delete(id);
    }
  }
}

function syncTasks(world) {
  const seen = new Set();
  for (const t of world.tasks ?? []) {
    if (t.status === "done" || t.status === "cancelled") continue;
    seen.add(t.id);
    let g = taskMeshes.get(t.id);
    if (!g) {
      g = new THREE.Group();
      const pickupMat = new THREE.MeshStandardMaterial({
        color: 0xff5a5a, emissive: 0xff5a5a, emissiveIntensity: 0.8,
      });
      const pickup = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), pickupMat);

      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
      const line = new THREE.Line(
        lineGeo,
        new THREE.LineDashedMaterial({
          color: 0xffffff, transparent: true, opacity: 0.45,
          dashSize: 0.6, gapSize: 0.4,
        }),
      );

      g.add(pickup); g.add(line);
      g.userData = { pickup, line };
      scene.add(g);
      taskMeshes.set(t.id, g);
    }
    const p = gridToWorld(t.pickup[0], t.pickup[1]);
    const d = gridToWorld(t.delivery[0], t.delivery[1]);
    g.userData.pickup.position.set(p.x, 1.6, p.z);
    const claimedColor = (t.assigned_to !== null && t.assigned_to !== undefined) ? 0x55dd77 : 0xff5a5a;
    g.userData.pickup.material.color.setHex(claimedColor);
    g.userData.pickup.material.emissive.setHex(claimedColor);
    const positions = g.userData.line.geometry.attributes.position.array;
    positions[0] = p.x; positions[1] = 0.15; positions[2] = p.z;
    positions[3] = d.x; positions[4] = 0.15; positions[5] = d.z;
    g.userData.line.geometry.attributes.position.needsUpdate = true;
    g.userData.line.computeLineDistances();
  }
  for (const [id, g] of taskMeshes) {
    if (!seen.has(id)) {
      scene.remove(g);
      taskMeshes.delete(id);
    }
  }
}

function syncPaths(world) {
  for (const pl of pathLines) {
    scene.remove(pl);
    pl.geometry.dispose(); pl.material.dispose();
  }
  pathLines = [];
  for (const r of world.robots ?? []) {
    if (!r.path || r.path.length === 0) continue;
    const isLeader = r.role === "LEADER";
    const points = [];
    const start = gridToWorld(r.pos[0], r.pos[1]);
    points.push(new THREE.Vector3(start.x, 0.25, start.z));
    for (const cell of r.path) {
      const p = gridToWorld(cell[0], cell[1]);
      points.push(new THREE.Vector3(p.x, 0.25, p.z));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: isLeader ? LEADER_COLOR : WORKER_COLOR,
      transparent: true, opacity: 0.55,
    });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    pathLines.push(line);
  }
}

// ---------------------------------------------------------------------------
// HUD updates
// ---------------------------------------------------------------------------
function fmtTime(t) {
  const s = Math.max(0, Math.floor(t || 0));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function updateHUD(world, info) {
  const stats = world.stats ?? {};
  document.getElementById("s-completed").textContent = stats.completed ?? 0;
  document.getElementById("s-time").textContent      = fmtTime(stats.elapsed ?? 0);
  document.getElementById("s-rate").textContent      = (stats.rate ?? 0).toFixed(1);
  document.getElementById("s-last").textContent      =
    stats.last_route_time != null ? `${stats.last_route_time.toFixed(2)}s` : "--";
  document.getElementById("s-avg").textContent       =
    stats.avg_route_time != null ? `avg ${stats.avg_route_time.toFixed(1)}s` : "";

  const queue = (world.task_queue || []).length;
  const queuedTotal = stats.queued_total ?? 0;
  document.getElementById("s-queue").textContent = queue;
  document.getElementById("s-queue-total").textContent =
    queuedTotal > 0 ? `${queuedTotal} requested` : "";

  const claw = (info && info.nemoclaw) || null;
  if (claw) {
    document.getElementById("s-claw").textContent = `${claw.allow}/${claw.deny}`;
    document.getElementById("s-claw-mode").textContent =
      (claw.enforce ? "ENFORCE" : "log-only") + " · " + (claw.policy || "");
  } else {
    document.getElementById("s-claw").textContent = "--";
    document.getElementById("s-claw-mode").textContent = "inactive";
  }

  const speed = world.speed_multiplier ?? 1;
  document.getElementById("btn-speed").textContent = `SPEED ${speed}x →`;

  const conn = world.connection_status ?? "online";
  const cb = document.getElementById("conn-badge");
  cb.textContent = conn.toUpperCase();
  cb.className = "badge " + conn;
  const dis = document.getElementById("btn-disconnect");
  if (conn === "offline") {
    dis.textContent = "LOCAL NIM ACTIVE";
    dis.classList.remove("danger");
    dis.classList.add("ok");
  } else {
    dis.textContent = "FORCE LOCAL NIM";
    dis.classList.remove("ok");
    dis.classList.add("danger");
  }

  const mockBadge = document.getElementById("mock-badge");
  if (info && info.mock) { mockBadge.style.display = "inline-block"; }
  else { mockBadge.style.display = "none"; }

  if (info && info.endpoints) {
    document.getElementById("endpoints").textContent = info.endpoints;
  }

  const log = document.getElementById("log");
  const messages = (world.blackboard ?? []).slice(-32);
  // Build role lookup for nicer source labels
  const roleById = new Map();
  for (const r of (world.robots ?? [])) roleById.set(r.id, r.role);
  // Re-render only when content actually changed
  const sig = messages.length + ":" + (messages[messages.length - 1]?.timestamp ?? 0);
  if (log.dataset.sig !== sig) {
    log.dataset.sig = sig;
    log.innerHTML = "";
    for (const m of messages.slice().reverse()) {
      const row = document.createElement("div");
      row.className = "row";
      const fromId = m.from;
      const src =
        fromId === -1 ? "Strategist" :
        roleById.get(fromId) === "LEADER" ? `Leader-${fromId}` : `Worker-${fromId}`;
      const t = String(m.type || "");
      const content = String(m.content || "").slice(0, 80);
      row.innerHTML =
        `<span class="ts">[${t}]</span> ` +
        `<span class="src">${src}:</span>` +
        `<span class="msg type-${t}"> ${escapeHtml(content)}</span>`;
      log.appendChild(row);
    }
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------------------------------------------------------------------------
// Polling loop
// ---------------------------------------------------------------------------
async function pollState() {
  try {
    const r = await fetch(STATE_URL, { cache: "no-store" });
    if (!r.ok) return;
    const data = await r.json();
    const world = data.world ?? {};
    syncWalls(world);
    syncWorkstations(world);
    syncDesignatedZones(world);
    syncChargingArea(world);
    syncRobots(world);
    syncTasks(world);
    syncPaths(world);
    updateHUD(world, data.info ?? {});
  } catch (e) { /* server down briefly; just try again */ }
}
setInterval(pollState, 100);
pollState();

// ---------------------------------------------------------------------------
// Animation loop with smooth lerp for robots and rotating task gems
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const lerp = 1 - Math.exp(-dt * 9);
  for (const [id, g] of robotMeshes) {
    const v = robotVisualPos.get(id);
    if (!v || !v.target) continue;
    v.x += (v.target.x - v.x) * lerp;
    v.z += (v.target.z - v.z) * lerp;
    g.position.x = v.x;
    g.position.z = v.z;
    if (g.userData.ring) g.userData.ring.rotation.y += dt * 0.7;
  }
  for (const [, g] of taskMeshes) {
    if (g.userData.pickup) g.userData.pickup.rotation.y += dt * 1.4;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
new ResizeObserver(resize).observe(stage);
resize();

// ---------------------------------------------------------------------------
// Actions: chat + buttons
// ---------------------------------------------------------------------------
async function sendAction(payload) {
  try {
    await fetch(ACTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (e) { console.warn("action failed", e); }
}

const chat = document.getElementById("chat-input");
const send = () => {
  const text = chat.value.trim();
  if (!text) return;
  sendAction({ type: "user_prompt", text });
  chat.value = "";
};
document.getElementById("send-btn").addEventListener("click", send);
chat.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

document.getElementById("btn-reset").addEventListener("click",      () => sendAction({ type: "reset" }));
document.getElementById("btn-speed").addEventListener("click",      () => sendAction({ type: "speedup" }));
document.getElementById("btn-disconnect").addEventListener("click", () => sendAction({ type: "disconnect" }));

// ---------------------------------------------------------------------------
// BUILDER mode — click the floor to add walls, right-click to remove.
// Drag with the left button to paint a row of cells.
// ---------------------------------------------------------------------------
let mode = "cursor";  // "cursor" | "builder"
const btnCursor  = document.getElementById("btn-mode-cursor");
const btnBuilder = document.getElementById("btn-mode-builder");

function setMode(next) {
  mode = next;
  btnCursor.classList.toggle("active",  mode === "cursor");
  btnBuilder.classList.toggle("active", mode === "builder");
  // OrbitControls hijacks left-drag for camera rotation; in builder mode we
  // want left-drag to paint walls instead. Right-drag still pans the camera.
  controls.enabled = (mode !== "builder");
  hoverMesh.visible = (mode === "builder");
  renderer.domElement.style.cursor = (mode === "builder") ? "crosshair" : "";
}
btnCursor.addEventListener("click",  () => setMode("cursor"));
btnBuilder.addEventListener("click", () => setMode("builder"));

// Invisible plane we raycast against to convert mouse -> grid cell.
const pickPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(GRID, GRID),
  new THREE.MeshBasicMaterial({ visible: false }),
);
pickPlane.rotation.x = -Math.PI / 2;
pickPlane.position.set(GRID / 2, 0, GRID / 2);
scene.add(pickPlane);

// Hover preview cell.
const hoverMesh = new THREE.Mesh(
  new THREE.BoxGeometry(1.02, 0.05, 1.02),
  new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.45 }),
);
hoverMesh.visible = false;
scene.add(hoverMesh);

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const paintedThisDrag = new Set();
let painting = false;

function eventToCell(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((ev.clientX - rect.left) / rect.width)  * 2 - 1;
  ndc.y = -((ev.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(pickPlane, false);
  if (!hits.length) return null;
  const p = hits[0].point;
  const gx = Math.floor(p.x);
  const gy = Math.floor(p.z);
  if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return null;
  return [gx, gy];
}

renderer.domElement.addEventListener("contextmenu", (ev) => {
  if (mode === "builder") ev.preventDefault();  // right-click = erase, not menu
});

renderer.domElement.addEventListener("pointermove", (ev) => {
  if (mode !== "builder") return;
  const cell = eventToCell(ev);
  if (!cell) { hoverMesh.visible = false; return; }
  hoverMesh.visible = true;
  hoverMesh.position.set(cell[0] + 0.5, 0.05, cell[1] + 0.5);
  // Drag-paint: if left button is held, paint each cell entered exactly once.
  if (painting && (ev.buttons & 1)) {
    const key = cell[0] + "," + cell[1];
    if (!paintedThisDrag.has(key)) {
      paintedThisDrag.add(key);
      sendAction({ type: "wall_add", cell });
    }
  }
});

renderer.domElement.addEventListener("pointerdown", (ev) => {
  if (mode !== "builder") return;
  const cell = eventToCell(ev);
  if (!cell) return;
  if (ev.button === 2) {
    sendAction({ type: "wall_remove", cell });
    return;
  }
  if (ev.button === 0) {
    painting = true;
    paintedThisDrag.clear();
    paintedThisDrag.add(cell[0] + "," + cell[1]);
    sendAction({ type: "wall_add", cell });
  }
});

renderer.domElement.addEventListener("pointerup", () => {
  painting = false;
  paintedThisDrag.clear();
});
renderer.domElement.addEventListener("pointerleave", () => {
  hoverMesh.visible = false;
  painting = false;
  paintedThisDrag.clear();
});
</script>
</body>
